<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="/responsive.css" />
    <link rel="stylesheet" href="/form.css" />
    <title>Constructor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!--                                                  -->
    <!--               OPEN HAMBURGER MENU                -->
    <!--                                                  -->
    <div class="hamburger-menu">
      <img src="/icons/menu.svg" class="svg-icon" />
    </div>

    <!-- SLIGHTLY DARKEN BACKGROUND OVERLAY FOR HAMBURGER -->
    <div class="overlay"></div>

    <div class="container">
      <div id="panel">
        <!--                                                  -->
        <!--                CLOSE MENU BUTTON                 -->
        <!--                                                  -->
        <div class="menu-close">
          <img src="/icons/x.svg" class="svg-icon" />
        </div>

        <div class="upper_navigation">
          <!--                                                  -->
          <!--               CAMPAIGN CREATOR TOOL              -->
          <!--                                                  -->
          <!-- <div id="action_buttons" class="group">
            <button id="new_campaign">
              <img src="/icons/new-campaign.svg" class="svg-icon" />

              New Campaign
            </button>
          </div> -->

          <!--                                                  -->
          <!--               SELECTS FOR RENDERING              -->
          <!--                                                  -->
          <div id="upper-selects-root"></div>

          <!--                                                  -->
          <!--             OPEN NSLT/LP/ISSUE/FIGMA             -->
          <!--                                                  -->
          <div id="campaign_links" class="group">
            <div class="split-button">
              <button disabled data-soft-hide data-disabled-hint="Select a language first" class="openCampaign external">
                Newsletter
                <img src="/icons/external-link.svg" class="svg-icon" />
              </button>

              <button disabled data-soft-hide data-disabled-hint="Select a language first" class="openContent openLP external">
                Content Page
                <img src="/icons/external-link.svg" class="svg-icon" />
              </button>
            </div>

            <button disabled data-soft-hide data-disabled-hint="Select a campaign first" class="openIssue external">
              Open Issue Card
              <img src="/icons/external-link.svg" class="svg-icon" />
            </button>

            <button disabled data-soft-hide data-disabled-hint="Select a campaign first" class="figmaCard">
              <img src="/icons/figma.svg" class="svg-icon" />

              Figma Template
            </button>
          </div>

          <!--                                                  -->
          <!--                  COPY TEMPLATE                   -->
          <!--                                                  -->
          <button disabled data-soft-hide data-disabled-hint="Select a shop first" class="copyTemplate">
            <img src="/icons/copy.svg" class="svg-icon" />

            <span class="copyTemplate__label">Copy Template</span>
          </button>
        </div>
      </div>

      <div id="app">
        <!--
        template injection: @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@
      -->
        <div id="app-content"></div>
        <div id="loader">
          <img height="48" src="/icons/loader.svg" />
        </div>
      </div>
    </div>

    <!-- outside #panel, so they stay visible when the mobile menu is closed -->
    <div id="floating-tools">
      <div id="purge-select-root"></div>

      <button
        disabled
        data-soft-hide
        data-disabled-hint="Select a campaign first"
        class="fab purgeDynamicSpreadsheet"
        type="button"
        aria-label="Purge dynamic spreadsheet"
      >
        <span class="fab-label">Purge dynamic spreadsheet</span>
        <img src="/icons/database-backup.svg" class="svg-icon" />
      </button>

      <button
        disabled
        data-soft-hide
        data-disabled-hint="Select a language first"
        class="fab redirectCheck"
        type="button"
        aria-label="Run redirect check"
      >
        <span class="fab-label">Run redirect check</span>
        <img src="/icons/waypoints.svg" class="svg-icon" />
      </button>

      <button id="preview_width" class="fab" type="button" aria-label="Toggle mobile preview" aria-pressed="false">
        <span class="fab-label">Mobile preview (390px)</span>
        <img src="/icons/smartphone.svg" class="svg-icon" />
      </button>

      <button id="new_products" class="fab" type="button" aria-label="Manage Products">
        <span class="fab-label">Manage Products</span>
        <img src="/icons/shopping-cart.svg" class="svg-icon" />
        <span id="products-badge-root"></span>
      </button>
    </div>

    <div id="formModal" class="modal-backdrop" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2>Create Campaign</h2>
            <p>Fill in the details below to create a new campaign.</p>
          </div>
          <div>
            <img src="https://i.imgur.com/TwK7qLa.png" />
          </div>
        </div>

        <div class="form-content">
          <!--
            form injection: @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@
          -->
        </div>
      </div>
    </div>

    <div id="productsModal" class="modal-backdrop" style="display: none">
      <div class="modal-content products-modal-content">
        <div class="modal-header">
          <div>
            <h2>Manage products</h2>
            <p class="products-modal-subtitle"></p>
          </div>
        </div>

        <div class="form-content products-modal-body"></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="src/app.jsx"></script>
    <script src="/hamburger.js"></script>
    <script type="module" src="/form/prepareCreatorForm.js"></script>
  </body>
</html>
